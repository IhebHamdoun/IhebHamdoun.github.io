<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div class="page">

        <header class="todo-header">
            <h1>To Do List</h1>
            <div class="button-row">
                <button type="button" id="back-home-button">Back to homepage</button>
            </div>
        </header>

        <section>
            <ul class="todo-list">
                <!-- List items will go here -->
            </ul>

            <div class="add-todo-row">
                <input type="text" id="new-todo" placeholder="Add a new item">
                <button type="button" id="add-todo-button">Add To Do</button>
            </div>
        </section>

    </div>

    <script src="todo.js"></script>
</body>

</html>
